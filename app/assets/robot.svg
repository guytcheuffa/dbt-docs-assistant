<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Robot">
  <!-- Antenne -->
  <line x1="32" y1="6" x2="32" y2="13" stroke="#1B1F24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="5.5" r="3.6" fill="#FF694A"/>
  <!-- Oreilles -->
  <rect x="3" y="28" width="7" height="14" rx="3.5" fill="#1B1F24"/>
  <rect x="54" y="28" width="7" height="14" rx="3.5" fill="#1B1F24"/>
  <!-- Tête -->
  <rect x="8" y="12" width="48" height="46" rx="15" fill="#FF694A"/>
  <!-- Visière -->
  <rect x="14" y="20" width="36" height="22" rx="10" fill="#1B1F24"/>
  <!-- Yeux (clignement discret) -->
  <rect x="21" y="26" width="7" height="10" rx="3.5" fill="#FFFFFF">
    <animate attributeName="height" values="10;10;1.5;10" keyTimes="0;0.93;0.965;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="y" values="26;26;30.25;26" keyTimes="0;0.93;0.965;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="36" y="26" width="7" height="10" rx="3.5" fill="#FFFFFF">
    <animate attributeName="height" values="10;10;1.5;10" keyTimes="0;0.93;0.965;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="y" values="26;26;30.25;26" keyTimes="0;0.93;0.965;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <!-- Motif en croix pincée, clin d'œil au logo dbt -->
  <path d="M26 45.5 Q32 50 38 45.5 M26 54.5 Q32 50 38 54.5" stroke="#FFFFFF" stroke-width="2.8" fill="none" stroke-linecap="round"/>
</svg>
